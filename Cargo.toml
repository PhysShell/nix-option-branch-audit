[package]
name = "oba"
version = "0.4.0"
edition = "2021"
description = "Layer-1 spike: option branch activation evidence for NixOS modules"
repository = "https://github.com/PhysShell/nix-option-branch-audit"
license = "MIT OR Apache-2.0"

[[bin]]
name = "oba"
path = "src/main.rs"

# `cfg(kani)` is only ever set by the `cargo kani` toolchain (see the
# KANI-0 proofs module in src/main.rs, entirely gated behind it and
# invisible to every normal build); declared here so a plain
# `cargo build`/`cargo clippy` doesn't warn about an "unknown" cfg.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[dependencies]
rnix = "0.11"
rowan = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
sha2 = "0.10"
# H2: genuine property-based testing for the pure Predicate IR/evaluator
# (Pred::Not/And/Or algebraic laws, monotonicity under partial
# environments) -- the maintained, standard Rust property-testing crate
# (AGENTS.md reuse-first rule step 3, applied to the test infrastructure
# itself: hand-rolling a small ad hoc generator loop and calling it
# "property testing" would just be a differently-shaped unit test).
proptest = "1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
