[package]
name = "oba"
version = "0.1.0"
edition = "2021"
description = "Layer-1 spike: option branch activation evidence for NixOS modules"

[[bin]]
name = "oba"
path = "src/main.rs"

[dependencies]
rnix = "0.11"
rowan = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
sha2 = "0.10"
