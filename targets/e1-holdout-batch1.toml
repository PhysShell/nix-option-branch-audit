# E1 holdout audit, batch 1 (candidates 1-10 of the pre-registered draw
# order -- see fixtures/e1-holdout-audit/protocol.md). Real NixOS/nixpkgs
# module.nix + test.nix pairs, vendored unmodified, none used anywhere in
# K1-K5. Watched option per candidate chosen by a fixed rule: prefer the
# richest real branch-gated option the test actually exercises over bare
# `enable` when one exists; fall back to `enable` otherwise. Chosen BEFORE
# running the tool, recorded in fixtures/e1-holdout-audit/batch1.md.

