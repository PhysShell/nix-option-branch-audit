# S6-R1 P1: 28 mechanically-derived targets from the 5 PRs (of 15 sampled)
# that reached target-construction-protocol.md step 6, in frozen sample
# order. See fixtures/s6-r1/P1-target-construction.md for the per-PR
# derivation record and fixtures/s6-r1/P1-adjudication-and-accounting.md
# for the real oba results and adjudication. module/test paths are
# root-relative; base/head source for each PR was fetched into its own
# scratch tree (not part of this repo) keyed by the PR's own base_sha/
# merge_commit_sha, recorded per-target in the target-construction doc.

