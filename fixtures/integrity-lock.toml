# Locks each vendored (non-mutation, non-synthetic) fixture file's sha256,
# checked offline by tests/fixture_integrity.rs on every `cargo test`.
# repo/commit/upstream_path are provenance CLAIMS, not independently
# re-verified by that test (no network/checkout in a normal test run) --
# only the sha256 field is actually enforced there. The claims themselves
# are re-derivable and checkable with `scripts/verify-upstream.sh` against
# a real nixpkgs checkout, on demand, not as part of `cargo test`.
#
# Without the sha256 check at least, "these fixtures are the real
# 5530e24f2/d81d88f4354b commits" would be just a comment someone could
# silently invalidate by "cleaning up" a fixture for convenience six months
# from now, with the test suite staying green the whole time.
#
# K1 provenance correction: the "after" commit was originally recorded as
# 37f81efa4abf623009e474fa563a094658c25be6. That SHA still resolves via the
# GitHub API (the object isn't GC'd), but it's no longer reachable from
# fix/doctrine-unix-socket-param-name's current tip -- the commit was
# amended once (to add an "Assisted-by" trailer) into 8af830954408277f2dc
# 11a0bc14d0c0700be46e0, then a further test-only follow-up landed on top
# as d81d88f4354b2c9d8a7492c9b72cd3add62a34e0 (current tip). Verified before
# repointing this lock: nixos/modules/services/web-apps/{kimai,davis}.nix
# are byte-identical (same sha256) at 37f81efa4/8af8309544/d81d88f4354b --
# only the commit message and a later, separate test-file change differ,
# never the module content this lock actually pins.
#
# Regenerate a hash after a deliberate fixture update with:
#   sha256sum fixtures/<path>

