name: Dogfood

# Exercises this repo's OWN action.yml (uses: ./, the composite action
# from PR C) against this repo's OWN fixtures. Not for coverage -- cargo
# test already covers the analysis itself far more thoroughly. This is
# here to prove that installation, cwd, paths, exit-code passthrough, and
# the JSON output/artifact actually work together inside a real GitHub
# Actions runner, not just look correct read in isolation. Pins
# oba-version explicitly (not "latest") so this workflow tests a known
# release deterministically, independent of whatever gets tagged next.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: oba check (clean manifest, must pass)
        id: clean
        uses: ./
        with:
          root: .
          targets: targets/clean.toml
          oba-version: v0.2.0
          artifact-name: oba-report-clean

      - name: assert clean run actually reported exit-code 0
        shell: bash
        # Passed via env, not spliced into the script with ${{ }} -- the
        # JSON body embeds Nix source text (parens, quotes) and can be
        # tens of KB; interpolating it as literal script text is exactly
        # the script-injection shape GitHub's own docs warn against, not
        # just a style preference. A real run caught this: the "mixed"
        # report's content broke the single-quoted echo with a bash
        # syntax error before jq ever ran.
        env:
          EXIT_CODE: ${{ steps.clean.outputs.exit-code }}
          REPORT_JSON: ${{ steps.clean.outputs.report-json }}
        run: |
          test "$EXIT_CODE" = "0"
          echo "$REPORT_JSON" | jq -e '.schema_version == 1'

      - name: oba check (mixed manifest, real OBA001 + davis inconclusive)
        id: mixed
        uses: ./
        continue-on-error: true
        with:
          root: .
          targets: targets/golden.toml
          oba-version: v0.2.0
          artifact-name: oba-report-mixed

      - name: assert mixed run failed the step with exit-code 2, not silently
        shell: bash
        # No report-json content check here on purpose (unlike the clean
        # case above) -- golden.toml's real report is ~390KB, and a real
        # run of this exact workflow showed that's already enough for
        # "Argument list too long" starting bash once the full JSON is
        # passed through env: for a downstream step (the OS execve()
        # argument+environment size limit, not a GitHub Actions-specific
        # one -- passing it via `env:` avoided the earlier script-
        # injection failure but not this). See action.yml's own comment
        # on the report-json output for the resulting size guidance; the
        # artifact upload two steps up is unaffected by any of this.
        env:
          STEP_OUTCOME: ${{ steps.mixed.outcome }}
          EXIT_CODE: ${{ steps.mixed.outputs.exit-code }}
        run: |
          test "$STEP_OUTCOME" = "failure"
          test "$EXIT_CODE" = "2"
