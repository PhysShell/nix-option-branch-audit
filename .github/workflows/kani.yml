name: Kani proofs

# KANI-0: bounded formal proofs of the semantic core (src/main.rs's
# `kani_proofs` module, `#[cfg(kani)]`-gated, invisible to every normal
# build). Runs here rather than locally on principle, not convenience:
# even the cheapest non-trivial `eval_pred` harness (a single `Ref`
# lookup against a real `HashMap<Vec<String>, KnownValue>`) pushed a
# 1-core/1.9GB dev VPS to under 100MB free and 2.4GB of swap before
# finishing, because CBMC has to symbolically model Rust's SipHash-based
# `HashMap` hasher regardless of how small the surrounding harness is --
# confirmed empirically across five escalating scope reductions, not
# guessed. GitHub-hosted runners have meaningfully more RAM/CPU
# headroom for exactly this kind of proof.
#
# Reuse survey (AGENTS.md step 3/5): tried the official
# `model-checking/kani-github-action` first (both published tags, `v1`
# and `v1.1`). Both failed the very first real run in ~25-30s, before
# ever reaching Kani itself, with "The version of Kani installed was
# different than the one requested" -- reproduced locally: their shared
# `install-kani.sh` extracts the installed version via `kani --version |
# awk '{print $2}'`, but `kani --version`'s real output is two lines
# ("Kani Rust Verifier 0.68.0 (standalone)" / "CBMC 6.11.0"), so field 2
# of line 1 is "Rust", not the version number -- a confirmed upstream
# parsing bug, not a config problem on this side (pinning `kani-version`
# explicitly, tried first, changes which comparison branch runs but not
# this mis-parse). `v1.1`'s copy of the same script additionally has
# `if [$? -eq 0]` / `if ["$x" != "$y"]` -- missing spaces around `[`,
# invalid bash test syntax. Composing around it: still uses Kani's own
# published `kani-verifier` crate and `cargo kani`, the same commands
# the action itself would run -- only the action's own broken
# self-verification wrapper is skipped.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  kani:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier
          cargo kani setup
      - name: Run Kani proofs
        run: cargo kani
