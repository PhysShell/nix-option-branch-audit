name: S5-F1D-R replay self-tests

# Reproducibility checks for the S5-F1D-R full-corpus acceptance replay
# -- no `oba` invocation, no network (the replay itself is a live,
# non-replayable fetch, already committed under replay/; this job only
# proves the comparison/reconciliation/classification scripts reproduce
# their own committed output from that already-committed data).

on:
  push:
    paths:
      - "fixtures/s5-f1d-r/**"
      - ".github/workflows/s5-f1d-r.yml"
  pull_request:
    paths:
      - "fixtures/s5-f1d-r/**"
      - ".github/workflows/s5-f1d-r.yml"

jobs:
  replay-comparison-reproducibility:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recompute applicable-manifest.json and diff against committed output
        run: |
          cd fixtures/s5-f1d-r
          python3 derive-applicable-manifest.py
          git diff --exit-code applicable-manifest.json || {
            echo "::error::applicable-manifest.json is not reproducible from the ledger -- regenerate and commit"
            exit 1
          }
      - name: Recompute comparison report and diff against committed output
        run: |
          cd fixtures/s5-f1d-r
          python3 compare-replay.py
          git diff --exit-code comparison-report.jsonl || {
            echo "::error::comparison-report.jsonl is not reproducible from the committed replay -- regenerate and commit"
            exit 1
          }
      - name: Recompute provenance reconciliation and diff against committed output
        run: |
          cd fixtures/s5-f1d-r
          python3 reconcile-discoveries.py || true
          git diff --exit-code provenance-reconciliation.json || {
            echo "::error::provenance-reconciliation.json is not reproducible -- regenerate and commit"
            exit 1
          }
      - name: Recompute delta classification and diff against committed output
        run: |
          cd fixtures/s5-f1d-r
          python3 classify-deltas.py
          git diff --exit-code delta-classification.json || {
            echo "::error::delta-classification.json is not reproducible -- regenerate and commit"
            exit 1
          }
      - name: Recompute leaf-collision scan and diff against committed output
        run: |
          cd fixtures/s5-f1d-r
          python3 scan-leaf-collisions.py
          git diff --exit-code leaf-collision-scan.json || {
            echo "::error::leaf-collision-scan.json is not reproducible -- regenerate and commit"
            exit 1
          }
