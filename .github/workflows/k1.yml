name: K1 (CDC real-eval proof)

# K1.1: the reproducibility gap the user's own hostile review flagged --
# every real, `#[ignore]`-by-default test across this whole project (K1's
# own historical/mutation proof, every later K2-K5/C-E1.2a/b/c real
# candidate proof, the C-E1.2c hostile-audit attack suite, P3a's own real
# CLI/registry tests) needs a real `nix` binary and network access, so it
# doesn't run under kani.yml (Kani-only toolchain) or dogfood.yml (no
# `nix`). Without this job, "it works" was a claim backed only by one
# specific dev machine, not CI. Runs both real suites this project now
# has: `--bin oba`'s own real tests (`--ignored "cdc::"`) and
# `tests/audit_cli.rs`'s own real CLI-level tests (P3a; a real gap found
# and closed as a direct follow-up commit right after P3a's own -- this
# workflow only ever targeted `--bin oba`, so a real `#[ignore]`d test
# living in a SEPARATE integration-test binary was never actually
# exercised by any CI workflow until this line existed). The offline half
# of both
# (`cargo test`'s own default run, no `--ignored`) already runs
# everywhere via `test.yml`, no separate job needed for it.
#
# Reuse survey (AGENTS.md step 3/5): cachix/install-nix-action is the same
# action PhysShell/nixpkgs's own CI (nixpkgs-vet job) already uses for
# exactly this -- a real Nix on a GitHub-hosted runner, no custom install
# script.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  k1-real-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: cachix/install-nix-action@v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          # `nix eval` (the new-style CLI src/cdc.rs shells out to) is
          # gated behind the nix-command experimental feature -- not on
          # by default on a fresh install.
          extra_nix_config: |
            experimental-features = nix-command
      - name: Run K1's real historical + mutation proof
        run: cargo test --bin oba -- --ignored "cdc::"
      - name: Run P3a's real CLI/registry tests (tests/audit_cli.rs)
        run: cargo test --test audit_cli -- --ignored
